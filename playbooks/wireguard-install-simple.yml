---
- hosts: "{{ hostlist | default('do_not_match_ever')}}"
  remote_user: "{{ local_ssh_user }}"
  become: true
  tasks:
    - name: Install wireguard
      apt:
        name:
          - wireguard
        state: present
        force_apt_get: yes
        cache_valid_time: 84600
      become: yes
      become_user: root

    - name: Enable IP forwarding for eth0 and wg0 when present
      ansible.posix.sysctl:
        name: "net.ipv4.conf.{{ item }}.forwarding"
        value: "1"
        state: present
        reload: yes
        sysctl_file: /etc/sysctl.d/99-mkrasberry.conf
      loop:
        - eth0
        - wg0
      when: item in ansible_facts['interfaces']

    - name: Disable reverse-path filtering for WireGuard routing interfaces
      ansible.posix.sysctl:
        name: "net.ipv4.conf.{{ item }}.rp_filter"
        value: "0"
        state: present
        reload: yes
        sysctl_file: /etc/sysctl.d/99-mkrasberry.conf
      loop:
        - all
        - default
        - eth0
        - wg0
        - wg1
      when: item in ['all', 'default'] or item in ansible_facts['interfaces']

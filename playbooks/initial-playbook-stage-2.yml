---
- hosts: "{{ hostlist | default('do_not_match_ever')}}"
  remote_user: "{{ local_ssh_user }}"
  become: true
  roles:
    - role: Stouts.hostname
    - role: msmtp
  #    - role: wifiClientSetup
  tasks:
    # Remove image default users (poison_usernames) completely. The old
    # one-liner (`killall -q ... && userdel`) skipped userdel whenever there
    # was nothing to kill and hid it with ignore_errors; older variants used
    # `userdel -f` without -r and left /home/<user> for a reused uid.
    - name: Default users - look up accounts
      ansible.builtin.getent:
        database: passwd
      tags: [poison_users]

    - name: Default users - stop sessions/processes
      shell: |
        loginctl terminate-user {{ item }} 2>/dev/null || true
        pkill -KILL -u {{ item }} && echo KILLED || true
      loop: "{{ poison_usernames }}"
      when: item in ansible_facts.getent_passwd
      register: poison_kill
      changed_when: "'KILLED' in poison_kill.stdout"
      tags: [poison_users]

    - name: Default users - delete account, home and mail
      user:
        name: "{{ item }}"
        state: absent
        remove: true
        force: true
      loop: "{{ poison_usernames }}"
      tags: [poison_users]

    - name: Default users - remove orphaned home directories
      file:
        path: "/home/{{ item }}"
        state: absent
      loop: "{{ poison_usernames }}"
      tags: [poison_users]

    - name: Default users - remove image NOPASSWD sudo rule
      file:
        path: /etc/sudoers.d/010_pi-nopasswd
        state: absent
      tags: [poison_users]

    - name: sudo group requires a password (per-user NOPASSWD rules live in sudoers.d)
      lineinfile:
        path: /etc/sudoers
        regexp: '^%sudo\s+ALL=\(ALL(:ALL)?\)\s+NOPASSWD:\s*ALL\s*$'
        line: "%sudo\tALL=(ALL:ALL) ALL"
        backrefs: true
        validate: "visudo -cf %s"
      tags: [poison_users]

    - name: Install requisite packages (likely present)
      apt:
        name:
          - neovim
          - jq
          - gawk
          - knockd
          - libpam-cgfs
          - cgroup-tools
#          - cgroupfs-mount
          - ca-certificates
          - systemd-cron
          - cron 
          - less
        state: present
        force_apt_get: yes
        cache_valid_time: 84600
    - sysctl:
        name: net.core.default_qdisc
        value: fq
        state: present
    - sysctl:
        name: net.ipv4.tcp_congestion_control
        value: bbr
        state: present
    - sysctl:
        name:  net.core.rmem_max
        value: "{{ MaxExpectedPathBDP }}"
        state: present
    - sysctl:
        name: net.core.wmem_max
        value: "{{ MaxExpectedPathBDP }}"
        state: present
    - sysctl:
        name: net.ipv4.tcp_rmem
        value: "4096 87380 {{ MaxExpectedPathBDP }}"
        state: present
    - sysctl:
        name: net.ipv4.tcp_rmem
        value: "4096 87380 {{ MaxExpectedPathBDP }}"
        state: present

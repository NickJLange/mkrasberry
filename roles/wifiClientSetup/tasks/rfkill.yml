---
# Unblock the wifi and Bluetooth radios. Safe to run on every play: each
# step acts only on a radio that is actually soft-blocked, and does nothing
# on hosts without that radio. Unblocking wifi only powers the radio; it
# does not configure or join any network, so Ethernet-only hosts keep their
# routes.

- name: Ensure rfkill is installed
  ansible.builtin.apt:
    name: rfkill
    state: present
    cache_valid_time: 84600

- name: Find soft-blocked radios
  ansible.builtin.shell: |
    for dev in /sys/class/rfkill/rfkill*; do
      [ -e "$dev/soft" ] || continue
      if [ "$(cat "$dev/soft")" = 1 ]; then cat "$dev/type"; fi
    done | sort -u
  register: rfkill_soft_blocked
  changed_when: false
  check_mode: false

- name: Check whether NetworkManager manages the radios
  ansible.builtin.command: systemctl is-active --quiet NetworkManager
  register: rfkill_networkmanager
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read NetworkManager's wifi radio setting
  ansible.builtin.command: nmcli -t -f WIFI radio
  register: rfkill_nm_wifi
  changed_when: false
  check_mode: false
  when: rfkill_networkmanager.rc == 0

# NetworkManager saves its own wifi on/off setting (WirelessEnabled in
# /var/lib/NetworkManager/NetworkManager.state) and reapplies it at start, so
# a bare `rfkill unblock wifi` can be undone at the next boot.
- name: Turn the wifi radio on through NetworkManager
  ansible.builtin.command: nmcli radio wifi on
  when:
    - rfkill_networkmanager.rc == 0
    - rfkill_nm_wifi.stdout | trim == 'disabled'

# Hosts without NetworkManager, or a block NetworkManager didn't set.
- name: Unblock wifi with rfkill
  ansible.builtin.command: rfkill unblock wifi
  when:
    - "'wlan' in rfkill_soft_blocked.stdout_lines"
    - rfkill_nm_wifi.stdout | default('') | trim != 'disabled'

- name: Unblock Bluetooth with rfkill
  ansible.builtin.command: rfkill unblock bluetooth
  when: "'bluetooth' in rfkill_soft_blocked.stdout_lines"

---


- set_fact:
    podman_path: "/usr/bin/podman"


- name: Check for podman in /usr/bin
  stat:
    path: "{{ podman_path }}"
  register: podman_ok


- name: Check for container-management tools
  apt:
    name:
      - systemd-container
    state: present
    force_apt_get: yes
    cache_valid_time: 84600

- block:
  - name: Check for Podman in alternate location
    stat:
      path: "{{ podman_local_path }}"
    register: podman_local_ok
  - set_fact:
      podman_path: "{{ podman_local_path }}"
  - fail:
      msg: "Podman not installed - do that first"
    when: podman_local_ok.stat.exists  != true
  when: podman_ok.stat.exists  != true

- name: "Check critical variables are defined."
  assert:
    that:
      - container_user is defined
      - container_group is defined
      - container_friendly_name is defined
      - container_prefix is defined
      - image_name is defined
      - container_home_url is defined

- import_tasks: add_user.yml

  tags: [container_add_user]

- import_tasks: install.yml

  tags: [container_install_binary]

# Checked as the service user, after add_user creates it: that is the podman the
# Quadlet unit runs, and rootful podman can be broken on hosts that only run rootless.
- name: Read podman version
  command: "{{ podman_path }} --version"
  args:
    chdir: /
  register: podman_version_out
  changed_when: false
  check_mode: false
  become: yes
  become_user: "{{ container_user }}"

- name: Require podman with Quadlet support (>= 4.4)
  assert:
    that:
      - podman_version is version('4.4', '>=')
    fail_msg: "podman {{ podman_version }} at {{ podman_path }} has no Quadlet support; 4.4 or newer is required."
  vars:
    podman_version: "{{ podman_version_out.stdout | regex_search('[0-9]+\\.[0-9]+(\\.[0-9]+)?') }}"





---

# systemd.yml - Retire the legacy generated unit, reload systemd, and (re)start the Quadlet service when needed

- name: Check that the role deployed a Quadlet unit
  stat:
    path: "{{ quadlet_path }}/{{ container_friendly_name }}.container"
  register: quadlet_unit
  become: yes
  become_user: root
  tags: container_systemd_start

- name: Fail when there is no Quadlet unit to start
  fail:
    msg: >-
      {{ quadlet_path }}/{{ container_friendly_name }}.container does not exist.
      The service role must deploy a Quadlet .container file before
      ansible-podman-systemd-generic post runs; roles still on the legacy
      podman-run first_run.yml (e.g. tvTunerSetup) are not supported.
  # In --check the role's template task only predicts the file
  when: not quadlet_unit.stat.exists and not ansible_check_mode
  tags: container_systemd_start

# Quadlet only pulls a missing image (Pull=missing) and AutoUpdate= is not used,
# so pull here as master's pre did; a new image ID triggers the restart below.
# Done first, before the legacy unit is stopped, so a failed pull leaves the
# running service alone.
- name: Pull {{ image_name }}
  shell: |
    {% if container_user != 'root' %}
    export XDG_RUNTIME_DIR=/run/user/$(id -u)
    {% endif %}
    {{ podman_path }} pull --quiet {{ image_name | quote }}
  args:
    chdir: /
    executable: /bin/bash
  register: quadlet_pull
  changed_when: false
  become: yes
  become_user: "{{ container_user }}"
  when: not ansible_check_mode
  tags: container_systemd_start

# Before the reload: record whether the loaded unit predates the .container on
# disk (NeedDaemonReload, e.g. an earlier run wrote the unit but failed before
# reloading) and a hash of Quadlet's generated unit. The restart task compares
# that hash after the reload, which catches changes that leave no newer file
# behind, such as a removed .container.d drop-in.
- name: Record the loaded state of {{ container_friendly_name }}.service
  shell: |
    {% if container_user != 'root' %}
    export XDG_RUNTIME_DIR=/run/user/$(id -u)
    systemctl --user show -p NeedDaemonReload --value {{ container_friendly_name | quote }}.service
    gen=$XDG_RUNTIME_DIR/systemd/generator
    {% else %}
    systemctl show -p NeedDaemonReload --value {{ container_friendly_name | quote }}.service
    gen=/run/systemd/generator
    {% endif %}
    cat "$gen"/{{ container_friendly_name | quote }}.service 2>/dev/null | sha256sum | cut -d' ' -f1
  args:
    chdir: /
    executable: /bin/bash
  register: quadlet_loaded_state
  changed_when: false
  failed_when: false
  check_mode: false
  become: yes
  become_user: "{{ container_user }}"
  tags: container_systemd_start

- block:
  - name: snag the userid for rootless systemctl commands
    shell: "id -u {{ container_user }}"
    register: container_user_pid
    changed_when: false
    check_mode: false
    tags: container_systemd_start

  - name: enable lingering for rootless user
    shell: "XDG_RUNTIME_DIR=/var/run/user/{{ container_user_pid.stdout }} loginctl enable-linger {{ container_user }}"
    become: yes
    args:
      executable: /bin/bash

  - name: Check for legacy generated unit {{ systemd_prefix }}-{{ container_friendly_name }}.service
    stat:
      path: "{{ container_prefix }}/.config/systemd/user/{{ systemd_prefix }}-{{ container_friendly_name }}.service"
    register: legacy_user_unit

  - block:
    - name: stop and disable legacy generated unit
      shell: "XDG_RUNTIME_DIR=/var/run/user/{{ container_user_pid.stdout }} systemctl --user disable --now {{ systemd_prefix }}-{{ container_friendly_name }}.service"
      become_user: "{{ container_user }}"
      args:
        executable: /bin/bash

    - name: remove legacy generated unit file
      file:
        path: "{{ legacy_user_unit.stat.path }}"
        state: absent

    - name: forget the legacy unit's failed state
      shell: "XDG_RUNTIME_DIR=/var/run/user/{{ container_user_pid.stdout }} systemctl --user daemon-reload && XDG_RUNTIME_DIR=/var/run/user/{{ container_user_pid.stdout }} systemctl --user reset-failed {{ systemd_prefix }}-{{ container_friendly_name }}.service || true"
      become_user: "{{ container_user }}"
      args:
        executable: /bin/bash
    when: legacy_user_unit.stat.exists

  - name: systemd --user daemon-reload for rootless Quadlets
    shell: "XDG_RUNTIME_DIR=/var/run/user/{{ container_user_pid.stdout }} systemctl --user daemon-reload"
    become_user: "{{ container_user }}"
    args:
      executable: /bin/bash

  become: yes
  become_user: "{{ container_user }}"
  tags: container_systemd_start
  when: container_user != "root"

- block:
  - name: Check for legacy generated unit {{ systemd_prefix }}-{{ container_friendly_name }}.service
    stat:
      path: "{{ systemd_path }}/{{ systemd_prefix }}-{{ container_friendly_name }}.service"
    register: legacy_system_unit

  - block:
    - name: stop and disable legacy generated unit
      systemd:
        name: "{{ systemd_prefix }}-{{ container_friendly_name }}.service"
        state: stopped
        enabled: no
        scope: "{{ systemd_scope }}"

    - name: remove legacy generated unit file
      file:
        path: "{{ legacy_system_unit.stat.path }}"
        state: absent

    - name: forget the legacy unit's failed state
      shell: "systemctl daemon-reload && systemctl reset-failed {{ systemd_prefix }}-{{ container_friendly_name }}.service || true"
    when: legacy_system_unit.stat.exists

  - name: systemd daemon-reload for rootful Quadlets
    systemd:
      daemon_reload: yes
      scope: "{{ systemd_scope }}"

  become: yes
  become_user: root
  tags: container_systemd_start
  when: container_user == "root"

# Restart only when something the container reads changed since it last started,
# so an unchanged re-run causes no downtime. Inputs: the Quadlet unit and its
# drop-ins, the envfile, container_required_paths (certs etc.), and the service
# role's container_restart_watch (configs it renders). Also restarts when the
# local image differs from the running one, and starts the unit if it is down.
- name: Start or restart {{ container_friendly_name }}.service if needed
  shell: |
    set -euo pipefail
    {% if container_user != 'root' %}
    export XDG_RUNTIME_DIR=/run/user/$(id -u)
    sc="systemctl --user"
    gen=$XDG_RUNTIME_DIR/systemd/generator
    {% else %}
    sc="systemctl"
    gen=/run/systemd/generator
    {% endif %}
    unit={{ container_friendly_name | quote }}.service
    if ! $sc is-active --quiet "$unit"; then
      $sc start "$unit"
      echo "started: $unit was not running"
      exit 0
    fi
    since=$($sc show -p ActiveEnterTimestamp --timestamp=unix --value "$unit")
    since=${since#@}
    reason=""
    [ -n "$since" ] || reason="unknown start time"
    [ {{ need_reload | quote }} != yes ] || reason="loaded unit was older than the .container file"
    now_hash=$(cat "$gen"/{{ container_friendly_name | quote }}.service 2>/dev/null | sha256sum | cut -d' ' -f1)
    [ -n "$reason" ] || [ -z {{ loaded_hash | quote }} ] || [ "$now_hash" = {{ loaded_hash | quote }} ] ||
      reason="generated unit changed (e.g. a drop-in was added or removed)"
    for f in {{ restart_inputs | map('quote') | join(' ') }}; do
      [ -z "$reason" ] || break
      [ -e "$f" ] || continue
      # ctime, not mtime: copy tools (scp -p, rsync -t) cannot backdate it, and
      # clock skew on the sending host cannot put it in the future. Check the
      # link itself (re-pointed symlink) and what it points to.
      if [ -n "$(find "$f" -newerct "@$since" -print -quit 2>/dev/null || true)" ] ||
         [ -n "$(find -L "$f" -newerct "@$since" -print -quit 2>/dev/null || true)" ]; then
        reason="$f changed"
      fi
    done
    if [ -z "$reason" ]; then
      running=$({{ podman_path }} ps --filter label=PODMAN_SYSTEMD_UNIT="$unit" --format '{{ '{{' }}.ImageID{{ '}}' }}' | head -n1)
      local_id=$({{ podman_path }} image inspect --format '{{ '{{' }}.Id{{ '}}' }}' {{ image_name | quote }} 2>/dev/null || true)
      if [ -n "$running" ] && [ -n "$local_id" ]; then
        case "${local_id#sha256:}" in "${running#sha256:}"*) ;; *) reason="image {{ image_name }} updated";; esac
      fi
    fi
    if [ -n "$reason" ]; then
      $sc restart "$unit"
      echo "restarted: $reason"
    else
      echo "unchanged"
    fi
  args:
    chdir: /
    executable: /bin/bash
  vars:
    need_reload: "{{ (quadlet_loaded_state.stdout_lines | default([]))[0] | default('') }}"
    loaded_hash: "{{ (quadlet_loaded_state.stdout_lines | default([]))[1] | default('') }}"
    restart_inputs: >-
      {{ [quadlet_path ~ '/' ~ container_friendly_name ~ '.container',
          quadlet_path ~ '/' ~ container_friendly_name ~ '.container.d',
          container_env_file]
         + (container_required_paths | default([]))
         + (container_restart_watch | default([])) }}
  register: quadlet_service_start
  changed_when: quadlet_service_start.stdout != 'unchanged'
  become: yes
  become_user: "{{ container_user }}"
  tags: container_systemd_start

- debug:
    msg: "{{ container_friendly_name }}.service: {{ quadlet_service_start.stdout }}"
  when: quadlet_service_start.stdout is defined
  tags: container_systemd_start
